[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Jarvis-HEP-Sampler"
version = "1.0.1"
description = "Plug-in SDK for user-defined Jarvis-HEP samplers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Pengxuan Zhu" }
]
keywords = ["HEP", "physics", "sampling", "Jarvis-HEP", "plugin"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24",
  "jsonschema>=4.18",
  "PyYAML>=6.0",
]

[project.scripts]
jsampler = "jarvis_hep_sampler.cli:main"


[project.urls]
Homepage = "https://github.com/Pengxuan-Zhu-Phys/Jarvis-HEP-Sampler"
Repository = "https://github.com/Pengxuan-Zhu-Phys/Jarvis-HEP-Sampler"
Issues = "https://github.com/Pengxuan-Zhu-Phys/Jarvis-HEP-Sampler/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jarvis_hep_sampler*"]

[tool.setuptools.package-data]
jarvis_hep_sampler = ["py.typed", "templates/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
