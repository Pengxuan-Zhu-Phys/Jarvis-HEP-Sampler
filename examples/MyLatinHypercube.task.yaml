# Complete native Jarvis-HEP demo card; load MyLatinHypercube.py first.
Scan:
  name: sampler-lhs-demo
EnvReqs:
  V2:
    workers: 2
    batch_size: 4
Sampling:
  Method: MyLatinHypercube
  Bounds:
    seed: 7
    point_number: 32
    centered: true
  Variables:
    - name: x
      distribution:
        type: Flat
        parameters: {min: 0.0, max: 1.0}
    - name: y
      distribution:
        type: Flat
        parameters: {min: 0.0, max: 1.0}
  LogLikelihood:
    - name: LogL_Z
      expression: z
Operas:
  Modules:
    - name: DemoEggbox
      operator: jarvishep2.testing.eggbox.eggbox2d_numpy
      input:
        - {name: x, expression: x}
        - {name: y, expression: y}
      output:
        - {name: z, entry: z}
